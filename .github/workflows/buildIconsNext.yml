name: Build Icons Next

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 16.14.0

      - run: |
          npm ci
          npm run build:icons-next

      - uses: actions/upload-artifact@v4
        with:
          name: public
          path: public/
