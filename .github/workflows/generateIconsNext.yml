name: Generate Icons Next

on:
  pull_request:
    branches: [ master ]
    paths:
      - 'packages/icons-next/**'
      - 'tools/**'
      - 'package.json'
      - 'package-lock.json'

  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 16.14.0

      - run: |
          npm ci
          npm run generate:icons-next
