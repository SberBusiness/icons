name: Build
run-name: Build ${{ inputs.package }}

on:
  workflow_dispatch:
    inputs:
      package:
        description: Пакет
        required: true
        type: choice
        options:
          - icons-next
          - icons
          - illustrations

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 16.14.0

      - run: |
          npm ci
          npm run "build:${PACKAGE}"
        env:
          PACKAGE: ${{ inputs.package }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.package }}
          path: public/
